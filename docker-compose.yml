services:
  migrate:
    build: ./backend
    env_file: .env
    command: ["alembic", "upgrade", "head"]

  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  jobs:
    build: ./backend
    env_file: .env
    command: ["python", "-m", "app.jobs"]
    depends_on:
      api:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api
