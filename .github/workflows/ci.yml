name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/krishilink-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/krishilink-frontend

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint + typecheck
        working-directory: backend
        run: |
          ruff check app
          mypy app
      - name: Test
        working-directory: backend
        run: pytest app/tests -x -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ---- Git → Docker Hub ----
  images:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

      - name: Build + push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache,mode=max

  # ---- Docker Hub → AWS EC2 ----
  deploy:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2 over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          PAYMENTS_PROVIDER: ${{ secrets.PAYMENTS_PROVIDER }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          DEV_NO_AUTH: ${{ secrets.DEV_NO_AUTH }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # .env consumed by docker-compose.prod.yml (env_file) on the host.
          # DATABASE_URL is NOT here — it lives in ~/krishilink/db.env, created
          # once on the host, so the DB credential never touches CI/git.
          cat > .env.deploy <<ENVEOF
          JWT_SECRET=$JWT_SECRET
          ENV=prod
          OTP_DEV_ECHO=true
          ADMIN_PHONE=$ADMIN_PHONE
          PAYMENTS_PROVIDER=${PAYMENTS_PROVIDER:-stub}
          RAZORPAY_KEY_ID=$RAZORPAY_KEY_ID
          RAZORPAY_KEY_SECRET=$RAZORPAY_KEY_SECRET
          RAZORPAY_WEBHOOK_SECRET=$RAZORPAY_WEBHOOK_SECRET
          PLATFORM_FEE_PCT=0.05
          ACCEPT_WINDOW_HOURS=12
          PAYMENT_WINDOW_MIN=15
          DISPUTE_WINDOW_HOURS=48
          CORS_ORIGINS=$CORS_ORIGINS
          DEV_NO_AUTH=${DEV_NO_AUTH:-true}
          ENVEOF

          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            docker-compose.prod.yml "$EC2_USER@$EC2_HOST:~/krishilink/docker-compose.yml"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            .env.deploy "$EC2_USER@$EC2_HOST:~/krishilink/.env"
          rm .env.deploy
          $SSH "
            set -e
            cd ~/krishilink
            echo '$DOCKERHUB_TOKEN' | docker login -u '$DOCKERHUB_USERNAME' --password-stdin
            export DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME TAG=${{ github.sha }}
            docker compose pull
            docker compose down --remove-orphans
            docker compose up -d
            docker image prune -f
          "

      - name: Smoke check
        # retry loop — Neon free tier cold-starts (~1s) on first connect
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://${{ secrets.EC2_HOST }}/health" | grep -q '"status":"ok"'; then
              echo "deploy healthy"; exit 0
            fi
            sleep 5
          done
          echo "smoke check failed"; exit 1
