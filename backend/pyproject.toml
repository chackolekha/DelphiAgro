[project]
name = "krishilink-backend"
version = "0.1.0"
description = "KrishiLink farmer-retailer order management API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "PyJWT>=2.9",
    "httpx>=0.27",
    "apscheduler>=3.10.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "fakeredis>=2.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "pydantic.Field",
    "app.core.deps.require_role",
    "app.core.db.get_db",
    "app.core.redis_client.get_redis",
    "app.core.deps.get_current_user",
    "app.core.deps.require_verified",
]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
