# Production compose — pulls pre-built images (Docker Hub).
# Postgres is external (Neon); OTP/idempotency state is in-process.
#
# On the host, next to this file:
#   .env    — non-secret config, written by CI on each deploy (see ci.yml)
#   db.env  — created ONCE by you, never touched by CI:
#               DATABASE_URL=postgresql+asyncpg://user:pw@ep-xxx-pooler.<region>.aws.neon.tech/<db>?sslmode=require
#
# Compose also interpolates DOCKERHUB_USERNAME and TAG (exported by the deploy
# step, or set them in .env for manual use).

services:
  migrate:
    image: ${DOCKERHUB_USERNAME}/krishilink-backend:${TAG:-latest}
    env_file:
      - .env
      - db.env
    command: ["alembic", "upgrade", "head"]

  api:
    image: ${DOCKERHUB_USERNAME}/krishilink-backend:${TAG:-latest}
    env_file:
      - .env
      - db.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  jobs:
    image: ${DOCKERHUB_USERNAME}/krishilink-backend:${TAG:-latest}
    env_file:
      - .env
      - db.env
    command: ["python", "-m", "app.jobs"]
    depends_on:
      - api
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME}/krishilink-frontend:${TAG:-latest}
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
