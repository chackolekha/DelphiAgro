# Production/staging compose — pulls pre-built images from Docker Hub.
# Required env on the host: DOCKERHUB_USERNAME, TAG (git sha or 'latest'), plus .env
# Usage:  DOCKERHUB_USERNAME=you TAG=latest docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-krishilink}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: ${DOCKERHUB_USERNAME:?set}/krishilink-backend:${TAG:-latest}
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${DOCKERHUB_USERNAME:?set}/krishilink-backend:${TAG:-latest}
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  jobs:
    image: ${DOCKERHUB_USERNAME:?set}/krishilink-backend:${TAG:-latest}
    env_file: .env
    command: ["python", "-m", "app.jobs"]
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME:?set}/krishilink-frontend:${TAG:-latest}
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
